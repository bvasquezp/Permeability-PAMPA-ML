name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate PAMPA QSAR artifacts
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install validation dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build data manifest
        shell: pwsh
        run: python src/build_data_manifest.py

      - name: Validate file integrity
        shell: pwsh
        run: python src/validate_project.py

      - name: Reproduce final metrics
        shell: pwsh
        run: python src/check_final_metrics.py

      - name: Create MLflow payload preview
        shell: pwsh
        run: python src/mlflow_tracking.py --dry-run

      - name: Run RDKit governance tests
        shell: pwsh
        run: pytest -q
