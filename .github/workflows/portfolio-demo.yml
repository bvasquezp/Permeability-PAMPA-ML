name: Freelance portfolio demo
on:
  push:
    paths:
      - "portfolio/**"
      - ".github/workflows/portfolio-demo.yml"
  pull_request:
    paths:
      - "portfolio/**"
      - ".github/workflows/portfolio-demo.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Excel dependency
        run: python -m pip install -r portfolio/requirements.txt
      - name: Build demo artifacts
        run: python portfolio/demo.py --output portfolio/output
      - name: Run tests
        run: python -m unittest discover -s portfolio -p 'test_*.py' -v
      - name: Check expected files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path("portfolio/output")
          for name in ("clean_records.csv", "rejected_records.csv", "reconciliation.csv", "summary.xlsx", "quality_summary.json"):
              assert (root / name).is_file(), name
          report = json.loads((root / "quality_summary.json").read_text())
          assert report["input_rows"] == 6 and report["valid_rows"] == 3 and report["rejected_rows"] == 3
          assert report["excel_created"] is True
          print("Validated synthetic sample results")
          PY
